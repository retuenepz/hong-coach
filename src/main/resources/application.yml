server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: hong-coach
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  ai:
    dashscope:
      # 只有 coach.provider=dashscope 时才用得上。
      # 其余情况 config/LlmProviderGuard 会把百炼整套自动配置关掉：它那批
      # agent / image / video 自动配置不认 model.chat，只认 spring.ai.dashscope.enabled，
      # key 为空时会在启动阶段抛「DashScope API key must be set」把应用带崩。
      api-key: ${DASHSCOPE_API_KEY:}
    retry:
      # spring-ai 默认重试 10 次、间隔 2s 起、每次 ×5（最长能拖到几分钟）。对「等模型回话」
      # 这种场景既慢又费钱：两次尝试等于两份 token，而且上游一旦超时，重试只是再等一遍。
      # 这里收敛成「快速失败 + 重试一次」。
      # （只作用于走 Spring AI 的百炼链路；DeepSeek 自己发请求，超时由 coach.* 那几项管。）
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2000ms
# 建表由 config/DatabaseSchemaInitializer 在启动后执行（见 db/schema.sql），
# 不用 spring.sql.init 是因为它在连不上库时会直接让应用起不来。

mybatis-plus:
  configuration:
    # 枚举按名字存成字符串（RED / BLACK），换枚举值顺序不会损坏历史数据
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false

logging:
  file:
    path: logs
  level:
    root: INFO
    com.hong.coach: INFO

# 象棋引擎配置
engine:
  # 引擎目录。留空或指向不存在的目录时，自动使用 classpath 内置引擎（src/main/resources/engine）
  path: ${ENGINE_PATH:}
  # Windows 本地开发用 avx2 版；Linux 服务器上通常改成 Pikafish-Linux-x86-64-universal
  exe-file-name: ${ENGINE_EXE:pikafish-avx2.exe}
  nnue-file-name: ${ENGINE_NNUE:pikafish.nnue}
  # 电脑落子时的思考时间（毫秒），越大越强也越慢
  play-movetime: 600
  # 复盘分析时的思考时间（毫秒）
  analyze-movetime: 900
  # 复盘时输出几路主变
  multi-pv: 3
  # 引擎进程池大小，决定能同时服务几局
  pool-size: 2
  # 借用引擎的最长等待时间（毫秒）
  borrow-timeout-ms: 15000

# AI 教练配置
coach:
  enabled: ${COACH_ENABLED:true}
  # 用哪一家的模型：deepseek（自己发请求）| dashscope（走 Spring AI）| none（只出本地提示）
  provider: ${COACH_PROVIDER:deepseek}
  # 用户一步棋亏超过多少厘兵（80 = 0.8 个兵）就主动开口讲解
  trigger-threshold: 80
  # 讲解是流式的，这一项管「两段输出之间最多停顿多久（毫秒）」。
  # 计时从发出请求那一刻就开始，所以首字迟迟不来也算超时 —— 超了立刻降级成本地提示，
  # 用户不会对着转圈的对话框干等。
  timeout-ms: 40000
  # 一条流最多持续多久（毫秒），到点就收尾。管的是「模型一直在慢慢吐」，与上面那项分工不同。
  stream-max-ms: 180000
  # 与模型服务建立连接的超时（毫秒）
  http-connect-timeout-ms: 10000
  # 单个 HTTP 请求的整体超时（毫秒）。要大过模型的「首字延迟」，否则会被误判成调用失败：
  # 详见 config/LlmHttpClientConfig —— 不显式设置时，classpath 上的 OkHttp 会让它退化成 10 秒。
  # 只作用于百炼链路。
  http-read-timeout-ms: 120000

  deepseek:
    # 只能从环境变量注入。没配时 AI 教练自动降级为本地提示，不影响下棋。
    # 【不要在这里写死 key】它会被提交进 git。
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    # 可选 deepseek-flash（快、便宜）或 deepseek-v4-pro（更强但慢得多）
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    # 思考量。none = 不思考，正文立刻开始吐。
    # 引擎已经把棋算完了，模型只负责把结论翻译成人话，让它再推演一遍既慢又没意义：
    # 实测同一个提问，不传该字段首字 4.7~8.3 秒，none 时思考 token 归零、首字 0.4~0.5 秒。
    # 想让它重新推演（点评细节会多些，但会重新卡住）就设成 low / high / max，留空表示不传。
    reasoning-effort: ${COACH_REASONING_EFFORT:none}
    # 单次回复的 token 上限。讲解本身要求在 200 字以内，留足余量即可。
    max-tokens: ${COACH_MAX_TOKENS:800}
    # 到「响应头」为止的超时（毫秒），含 TLS 握手与服务端排队/首字时间。
    # 它不会误伤流式传输中途的正常停顿 —— 那种停顿由 coach.timeout-ms 管。
    first-byte-timeout-ms: ${COACH_FIRST_BYTE_TIMEOUT_MS:30000}
