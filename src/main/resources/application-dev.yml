# 开发环境：连内网 MySQL。
# 所有值都可以用环境变量覆盖；不设环境变量时用下面的默认值，开箱即用。
# 注意：这里刻意用 DB_HOST / DB_USER / DB_PASSWORD / DB_NAME 这几个名字，
# 避免和 IDEA 里遗留的 DB_URL / DB_USERNAME / DB_PASSWD 撞车。
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: 'jdbc:mysql://${DB_HOST:10.100.6.20}:${DB_PORT:3307}/${DB_NAME:chess_coach_db}?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai'
    username: ${DB_USER:chess_db_usr}
    password: ${DB_PASSWORD:Xb123445%}
    hikari:
      # 连不上库时不要在启动阶段就把应用拖死：对局会降级为仅内存
      initialization-fail-timeout: -1
      # 拿不到连接时最多等 3 秒就放弃，避免拖慢走子
      connection-timeout: 3000
      maximum-pool-size: 8
      minimum-idle: 1
